name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Require release decisions
        run: |
          if [ ! -f LICENSE ]; then
            echo "Release blocked: the maintainer must select and add a license first."
            exit 1
          fi
          module_path="$(awk '/^module / { print $2; exit }' go.mod)"
          if [ -z "$module_path" ] || [ "$module_path" = depscope ]; then
            echo "Release blocked: the maintainer must replace the provisional Go module path first."
            exit 1
          fi
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Go packages
        run: go test -count=1 ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Scan Go dependencies and call paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check frontend contract
        working-directory: web
        run: pnpm check:contract
      - name: Lint frontend
        working-directory: web
        run: pnpm lint
      - name: Type check frontend
        working-directory: web
        run: pnpm typecheck
      - name: Test frontend
        working-directory: web
        run: pnpm test
      - name: Audit frontend production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high
      - name: Build frontend
        working-directory: web
        run: pnpm build
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web
        run: pnpm test:e2e
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
